name: BOMerang Offline Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned verification dependencies
        run: python -m pip install -r ci/requirements.txt

      - name: Run 506 isolated regressions, Flask and offline CycloneDX checks
        # Compiles Java 17 sources in a disposable copy, never checkout target/classes.
        # Three fresh pytest processes prevent collisions among legacy module copies.
        run: python -B ci/run_checks.py --output test-results/verification
        
      - name: Verify normalized priority SBOM export
        run: python -B -m pytest test_normalized_priority_sbom.py --import-mode=importlib -p no:cacheprovider -q --junitxml=test-results/verification/normalized-priority-sbom.xml

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bomerang-offline-verification
          path: test-results/verification/
          if-no-files-found: warn
